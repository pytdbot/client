name: Build TDLib
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Pytdbot
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Clone TDLib
        uses: actions/checkout@v6
        with:
          repository: tdlib/td
          fetch-depth: 1
          path: "td/"

      - name: Install Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install TDLib dependencies
        id: td
        run: |
          sudo apt-get update
          # sudo sudo apt-get install make zlib1g-dev libssl-dev gperf clang-6.0 libc++-dev libc++abi-dev -y
          # rm -rf td/build
          # mkdir td/build

      - name: Setup variables
        id: vars
        run: |
          echo "CURRENT_TDLIB_COMMIT_HASH=$(python -c "import json; print(json.loads(open('pytdbot/td_api.json').read())['commit_hash'])")" >> $GITHUB_OUTPUT
          echo "CURRENT_TDLIB_VERSION=$(python -c "import json; print(json.loads(open('pytdbot/td_api.json').read())['version'])")" >> $GITHUB_OUTPUT

          cd $GITHUB_WORKSPACE/td

          echo "LATEST_TDLIB_COMMIT_HASH=$(git log -1 --pretty=%H)" >> $GITHUB_OUTPUT
          echo "LATEST_TDLIB_VERSION=$(
            cat CMakeLists.txt |
            sed -nr 's/.*project\(TDLib VERSION (.*) LANGUAGES CXX C\).*/\1/p'
          )" >> $GITHUB_OUTPUT

      - name: TDLib version
        run: |
          echo "Current TDLib version: ${{ steps.vars.outputs.CURRENT_TDLIB_VERSION }} (${{ steps.vars.outputs.CURRENT_TDLIB_COMMIT_HASH }})"
          echo "Latest TDLib version: ${{ steps.vars.outputs.LATEST_TDLIB_VERSION }} (${{ steps.vars.outputs.LATEST_TDLIB_COMMIT_HASH }})"

      - name: Copy TDLib TL
        run: |
          cp td/td/generate/scheme/td_api.tl td_api.tl

      - name: Generate Pytdbot files
        run: |
          python generate_json.py "${{ steps.vars.outputs.LATEST_TDLIB_VERSION }}" "${{ steps.vars.outputs.LATEST_TDLIB_COMMIT_HASH }}"
          python generate_files.py
          python generate_ai_assets.py
          TD_FILES="pytdbot/types/td_types.py pytdbot/methods/td_functions.py pytdbot/handlers/td_updates.py"
          python -m pip install ruff
          python -m ruff check $TD_FILES --select I --fix
          python -m ruff format $TD_FILES pytdbot/types/__init__.py

          CURRENT_VERSION=${{ steps.vars.outputs.CURRENT_TDLIB_VERSION }}
          sed --binary -i "s/${CURRENT_VERSION//./\\.}/${{ steps.vars.outputs.LATEST_TDLIB_VERSION }}/g" README.md

      - name: Commit TDLib TL schema
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update TDLib to ${{ steps.vars.outputs.LATEST_TDLIB_VERSION }} (tdlib/td@${{ steps.vars.outputs.LATEST_TDLIB_COMMIT_HASH }})"
          add: '["td_api.tl"]'
          committer_name: GitHub Actions
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Commit generated Pytdbot files
        uses: EndBug/add-and-commit@v9
        with:
          message: "Generate Pytdbot files"
          add: '["README.md", "pytdbot/"]'
          committer_name: GitHub Actions
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Type check with ty
        run: |
          rm -rf td/

          python -m pip install --upgrade pip ty

          set +e
          ty_output="$(ty check 2>&1)"
          ty_status=$?
          set -e

          echo "$ty_output"

          {
            echo "# TDLib Build"
            echo
            echo "## TDLib"
            echo
            echo "| | Version | Commit |"
            echo "|---|---|---|"
            echo "| Current | \`${{ steps.vars.outputs.CURRENT_TDLIB_VERSION }}\` | \`${{ steps.vars.outputs.CURRENT_TDLIB_COMMIT_HASH }}\` |"
            echo "| Updated | \`${{ steps.vars.outputs.LATEST_TDLIB_VERSION }}\` | \`${{ steps.vars.outputs.LATEST_TDLIB_COMMIT_HASH }}\` |"
            echo
            echo "## Type Check"
            echo
            echo "**Tool:** \`ty\`"
            echo
            if [ "$ty_status" -eq 0 ]; then
              echo "### ✅ Passed"
              echo
              echo "No type checking errors were found."
            else
              echo "### ❌ Failed"
              echo
              echo '```text'
              echo "$ty_output"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$ty_status"
